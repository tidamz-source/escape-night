// ---------- minigame wrapper ----------
class MiniScene {
  constructor(def, charId) { this.def = def; this.charId = charId; this.restart(); }
  restart() { this.g = this.def.make(this.charId); this.phase = 'howto'; this.pt = 0; this.paused = false; this.endT = 0; }
  enter() {}
  update(dt) {
    if (this.paused) return;
    this.pt += dt;
    if (this.phase === 'count') { const before = Math.ceil(3 - (this.pt - dt) * 1.6); const now = Math.ceil(3 - this.pt * 1.6); if (now !== before && now > 0) SFX.count(); if (this.pt * 1.6 >= 3) { this.phase = 'play'; this.pt = 0; tone(880, .2); } }
    if (this.phase === 'play' || this.phase === 'end') {
      if (this.phase === 'end') { this.endT += dt; if (this.g.updateEnd) this.g.updateEnd(dt); return; }
      this.g.update(dt);
      if (this.g.result) {
        this.phase = 'end'; this.endT = 0;
        if (this.g.result === 'win' && this.def.id === 'final') { SAVE.finalDone = true; SAVE.leader = this.charId; persist(); go(Ending); return; }
        if (this.g.result === 'win') { const first = !SAVE.done[this.def.id]; SAVE.done[this.def.id] = true; SAVE.leader = this.charId; this.firstWin = first; persist(); SFX.win(); }
        else SFX.lose();
      }
    }
  }
  draw() {
    const g = this.g;
    g.draw();
    if (this.phase === 'play' && !this.paused) {
      if (iconButton(W - 24, 4, 20, (x, y) => { R(x - 3, y - 4, 2, 8, PAL.white); R(x + 1, y - 4, 2, 8, PAL.white); }) || input.keyTap.Escape || input.keyTap.KeyP) { input.keyTap.Escape = false; this.paused = true; }
    }
    if (this.phase === 'howto') {
      ctx.fillStyle = 'rgba(5,10,26,.6)'; ctx.fillRect(0, 0, W, H);
      const pw = 300, ph = 150, px = W / 2 - pw / 2, py = 50;
      panel(px, py, pw, ph);
      text(this.def.title, W / 2, py + 10, { align: 'center', size: 14, bold: true, color: PAL.glow });
      textBlock(this.def.howto, px + 16, py + 34, pw - 32, { size: 9, lh: 12, color: PAL.white });
      if (button(W / 2 - 56, py + ph - 30, 112, 22, "C'est parti", { primary: true, keys: ['Enter', 'Space'] })) { this.phase = 'count'; this.pt = 0; input.down = false; }
      if (button(8, H - 26, 76, 20, 'Camping', { size: 9, keys: ['Escape'] })) this.exit();
    } else if (this.phase === 'count') {
      const n = Math.ceil(3 - this.pt * 1.6);
      if (n > 0) { const k = (this.pt * 1.6) % 1; text(String(n), W / 2, H / 2 - 20, { align: 'center', size: 40 - k * 10, bold: true, color: PAL.glow }); }
    } else if (this.phase === 'end' && this.endT > (g.endDelay || 1)) {
      const win = g.result === 'win';
      ctx.fillStyle = 'rgba(5,10,26,.55)'; ctx.fillRect(0, 0, W, H);
      const pw = 280, ph = 130, px = W / 2 - pw / 2, py = 56;
      panel(px, py, pw, ph, { edge: win ? PAL.glow : PAL.red });
      text(win ? 'Épreuve réussie !' : 'Perdu !', W / 2, py + 12, { align: 'center', size: 16, bold: true, color: win ? PAL.glow : PAL.red });
      textBlock(win ? (g.winMsg || 'Papa est battu.') : (g.loseMsg || 'Papa a gagné cette manche.'), px + 18, py + 40, pw - 36, { size: 9, lh: 12 });
      if (win && this.firstWin) text(`${doneCount()}/5 épreuves`, W / 2, py + 72, { align: 'center', size: 9, color: PAL.warm });
      if (button(px + 16, py + ph - 32, 116, 22, win ? 'Rejouer' : 'Réessayer', { primary: !win, keys: win ? [] : ['Enter', 'Space'] })) { this.restart(); this.phase = 'count'; }
      if (button(px + pw - 132, py + ph - 32, 116, 22, 'Camping', { primary: win, keys: win ? ['Enter', 'Space', 'Escape'] : ['Escape'] })) this.exit();
    }
    if (this.paused) {
      ctx.fillStyle = 'rgba(5,10,26,.7)'; ctx.fillRect(0, 0, W, H);
      panel(W / 2 - 90, 80, 180, 110); text('Pause', W / 2, 92, { align: 'center', size: 14, bold: true, color: PAL.glow });
      if (button(W / 2 - 70, 118, 140, 22, 'Reprendre', { primary: true, keys: ['Escape', 'Enter', 'KeyP'] })) this.paused = false;
      if (button(W / 2 - 70, 150, 140, 22, 'Abandonner', {})) this.exit();
    }
  }
  exit() {
    if (this.def.id === 'final' && this.g.result === 'win') { go(Ending); return; }
    Hub.returnFrom = this.def.id; go(Hub);
  }
}

    for (const w of this.walls) for (let x = this.L; x < this.Rx; x += 7) if (x < w.gx || x > w.gx + w.gw) { circ(x + 3, w.y + Math.sin(x + t * 9) * 2, 6, '#ffffff'); circ(x + 3, w.y - 4, 3, '#dff4ff'); }
    for (const w of this.walls) { ctx.globalAlpha = .4; R(w.gx, w.y - 8, w.gw, 16, PAL.glow); ctx.globalAlpha = 1; }
    // player
    if (!(P.inv > 0 && Math.floor(t * 14) % 2)) {
      const im = IMG[`${this.cid}_${P.dir}`]; if (im) { const s = 1, h = im.height * s, clip = 1 - P.sink * .45; spr(`${this.cid}_${P.dir}`, P.x, P.y + h * (1 - clip) + (P.moving ? -Math.abs(Math.sin(P.anim * 12)) * 1.5 : 0), { s, clip }); }
      if (P.sink > .05) for (let i = 0; i < 5; i++) circ(P.x - 8 + i * 4, P.y - 1, 3 + P.sink * 2, '#ffffff');
      if (P.carry) drawObj(P.carry, P.x, P.y - 40, 1.1);
    }
    // blobs & shots
    for (const o of this.blobs) { circ(o.x, o.y, o.r, '#ffffff'); circ(o.x - 3, o.y - 3, 3, '#dff4ff'); circ(o.x + 4, o.y + 2, 2.5, '#e8f8ff'); }
    for (const s of this.shots) drawObj(s.type, s.x, s.y, 1.2, s.rot);
    this.parts.draw();
    // HUD
    panel(W / 2 - 80, 2, 160, 14, { fill: 'rgba(12,21,48,.9)' });
    text('Papa', W / 2 - 74, 3, { size: 9, bold: true, color: PAL.warm });
    for (let i = 0; i < B.max; i++) R(W / 2 - 40 + i * 12, 6, 10, 6, i < B.hp ? PAL.warm : '#2a3560');
    for (let i = 0; i < 3; i++) { const x = 12 + i * 14, y = 22, c = i < P.hp ? PAL.red : '#2a3560'; R(x, y, 4, 4, c); R(x + 5, y, 4, 4, c); R(x - 1, y + 2, 11, 4, c); R(x + 1, y + 6, 7, 2, c); R(x + 3, y + 8, 3, 1, c); }
    if (P.sink > .3) text('Bouge, tu t’enfonces !', 12, 36, { size: 8, color: PAL.warm });
    if (B.hp > 0 && !this.result) { const can = !!P.carry; ctx.globalAlpha = can ? 1 : .45; if (button(W - 84, H - 34, 76, 26, 'Lancer', { primary: can })) { if (can) this.throwIt(); } ctx.globalAlpha = 1; }
    if (this.banner) { ctx.globalAlpha = Math.min(1, this.banner.t * 2); panel(W / 2 - 140, 120, 280, 24, { edge: PAL.glow }); text(this.banner.txt, W / 2, 127, { align: 'center', size: 10, bold: true, color: PAL.glow }); ctx.globalAlpha = 1; }
  }
}
GAMES.final = { id: 'final', title: 'Le city stade', howto: 'Papa arrose tout le terrain depuis la cage. Esquive la mousse et ne reste pas immobile : tu t’enfonces.\nRamasse ballons et chaussures, place-toi sous Papa et touche Lancer (ou Espace). Neuf coups pour le faire tomber.', make: c => new BossGame(c) };

// ---------- ending ----------
const Ending = {
  t: 0, i: 0, dlg: new Dialog(), bubbles: [],
  lines: [['papa', 'Pfff... Bon. Vous m’avez eu, les trois.'], ['sacha', 'Alors... on peut rester ?'], ['papa', 'Juste ce soir. Et c’est moi qui choisis la musique !'], ['narr', 'La soirée mousse peut commencer.']],
  enter() { this.t = 0; this.i = 0; this.dlg.say(...this.lines[0]); SAVE.finalDone = true; persist(); this.bubbles = Array.from({ length: 50 }, () => ({ x: Math.random() * W, y: rand(140, H), r: rand(2, 6), v: rand(8, 26) })); },
  update(dt) {
    this.t += dt; this.dlg.update(dt);
    for (const b of this.bubbles) { b.y -= b.v * dt; if (b.y < 60) { b.y = H; b.x = Math.random() * W; } }
    if (this.i < this.lines.length && this.t > 1.5 && (input.tap || input.keyTap.Space || input.keyTap.Enter)) { input.tap = false; if (!this.dlg.done) this.dlg.skip(); else { this.i++; if (this.i < this.lines.length) this.dlg.say(...this.lines[this.i]); else { this.dlg.msg = ''; SFX.win(); } } }
  },
  draw() {
    const t = this.t;
    nightSky(t, '#120a30', '#2a1a50');
    // disco beams
    ctx.globalCompositeOperation = 'lighter';
    ['rgba(255,90,160,.18)', 'rgba(90,200,255,.18)', 'rgba(255,220,90,.16)', 'rgba(160,110,255,.18)'].forEach((c, i) => { const a = Math.sin(t * .9 + i * 1.7) * .6; ctx.fillStyle = c; ctx.beginPath(); ctx.moveTo(60 + i * 120, 0); ctx.lineTo(60 + i * 120 + Math.sin(a) * 260 - 30, H); ctx.lineTo(60 + i * 120 + Math.sin(a) * 260 + 30, H); ctx.fill(); });
    ctx.globalCompositeOperation = 'source-over';
    for (let i = 0; i < 20; i++) circ(i * 26 + 8, 10 + Math.sin(t * 2 + i) * 3, 2, ['#ff8a8a', '#ffd23a', '#8ff3ea', '#c3b3ff'][i % 4]);
    // foam sea back
    for (let x = 0; x < W; x += 10) circ(x + 5, 168 + Math.sin(x * .1 + t * 2) * 3, 12, '#e8f4ff');
    // characters in foam
    const pos = [['cam', 140], ['sacha', 200], ['rox', 260]];
    pos.forEach(([id, x], i) => { const jump = Math.abs(Math.sin(t * 4 + i)) * 8; spr(`${id}_pose`, x, 196 - jump, { s: 1.5 }); });
    const rise = clamp((t - .3) / 1.2, 0, 1);
    ctx.save(); ctx.beginPath(); ctx.rect(300, 0, 120, 186); ctx.clip(); spr('papa_down', 340, 236 - rise * 60, { s: 1.6 }); ctx.restore();
    for (const [x, y] of [[332, 116], [341, 112], [350, 116]]) circ(x, y + (1 - rise) * 60, 5, '#ffffff');
    // foam front
    for (let x = 0; x < W; x += 9) circ(x + 4, 188 + Math.sin(x * .13 + t * 2.4) * 4, 14, '#ffffff');
    R(0, 196, W, H - 196, '#ffffff'); for (let x = 0; x < W; x += 16) circ(x + 8, 206 + (x % 3) * 8, 5, '#e2f0ff');
    for (const b of this.bubbles) { ctx.strokeStyle = 'rgba(200,240,255,.7)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(b.x + Math.sin(t + b.x) * 4, b.y, b.r, 0, 7); ctx.stroke(); }
    if (this.i < this.lines.length) this.dlg.draw();
    else {
      panel(W / 2 - 130, 40, 260, 100, { edge: PAL.glow });
      text('Escape Night', W / 2, 52, { align: 'center', size: 22, bold: true, color: PAL.glow });
      text('Les cinq épreuves sont gagnées. Bonne soirée mousse !', W / 2, 82, { align: 'center', size: 8, color: PAL.lav });
      if (button(W / 2 - 120, 106, 112, 24, 'Camping', { primary: true, keys: ['Enter', 'Space'] })) { Hub.returnFrom = 'final'; go(Hub); }
      if (button(W / 2 + 8, 106, 112, 24, 'Écran titre', {})) go(TitleScene);
    }
  },
};

// ---------- main loop ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  resetT(); ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  if (scene) {
    scene.draw(); resetT();
    if (!transition.active || transition.dir < 0) scene.update(dt);
  }
  if (transition.active) {
    transition.t += dt * 3.2 * transition.dir;
    if (transition.dir > 0 && transition.t >= 1) { transition.t = 1; transition.dir = -1; setScene(transition.next); input.tap = false; input.down = false; }
    else if (transition.dir < 0 && transition.t <= 0) { transition.t = 0; transition.active = false; }
    resetT(); ctx.fillStyle = `rgba(4,8,22,${clamp(transition.t, 0, 1)})`; ctx.fillRect(0, 0, W, H);
  }
  input.tap = false; input.release = false; input.keyTap = {};
  requestAnimationFrame(frame);
}
(async function boot() {
  resetT(); ctx.fillStyle = '#081128'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#8ff3ea'; ctx.font = '12px monospace'; ctx.textAlign = 'center'; ctx.fillText('Chargement…', W / 2, H / 2);
  try { await Promise.race([document.fonts.load(`500 10px ${FONT}`).then(() => document.fonts.load(`700 10px ${FONT}`)), new Promise(r => setTimeout(r, 2500))]); } catch (_) {}
  await loadImages();
  setScene(TitleScene);
  requestAnimationFrame(t => { last = t; frame(t); });
})();

</script>
