let NEON = null;
function buildNeon() {
  const cw = 240, chh = 104, c = document.createElement('canvas'); c.width = cw; c.height = chh; const g = c.getContext('2d');

  g.font = '44px "Yellowtail", "Brush Script MT", cursive'; g.fillText('Escape', cw / 2, 46);
  g.font = '44px "Yellowtail", "Brush Script MT", cursive'; g.fillText('Night', cw / 2 + 6, 92);

  for (let i = 0; i < M.length; i++) M[i] = d.data[i * 4 + 3] > 110 ? 1 : 0;
  const dil = (src, r) => { const o = new Uint8Array(src.length); for (let y = 0; y < chh; y++) for (let x = 0; x < cw; x++) { if (!src[y * cw + x]) continue; for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) { if (dx * dx + dy * dy > r * r + 1) continue; const X = x + dx, Y = y + dy; if (X >= 0 && Y >= 0 && X < cw && Y < chh) o[Y * cw + X] = 1; } } return o; };
  const D1 = dil(M, 1), D2 = dil(M, 2);
  const out = g.createImageData(cw, chh);
  const put = (i, r, gg, b) => { out.data[i * 4] = r; out.data[i * 4 + 1] = gg; out.data[i * 4 + 2] = b; out.data[i * 4 + 3] = 255; };
  for (let y = 0; y < chh; y++) for (let x = 0; x < cw; x++) {
    const i = y * cw + x;
    if (M[i]) { const k = (y % 52) / 52; put(i, 30 + k * 60, 40 + k * 50, 110 + k * 70); if ((x * 7 + y * 13) % 97 === 0) put(i, 230, 245, 255); }
    else if (D1[i]) put(i, 160, 255, 246);
    else if (D2[i]) put(i, 190, 170, 255);
  }
  g.clearRect(0, 0, cw, chh); g.putImageData(out, 0, 0);
  NEON = c;
}

    const sh = B.shake > 0 ? Math.round(Math.sin(t * 80) * 2 * (B.shake / .45)) : 0;
    img('stade_bg', 0, 0);
    for (const x of [21, 121, 361, 461]) { ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = .25; glowDot(x, 6, 46, 'rgba(255,230,170,.8)'); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; }
    // mousse accumulée
    for (let r = 0; r < this.rows; r++) for (let c = 0; c < this.cols; c++) { const v = this.foam[r * this.cols + c]; if (v < .18) continue; const hsh = (r * 73 + c * 151) % 97, x = Math.round(this.L + c * 11.5 + (hsh % 9) - 2), y = Math.round(this.top + r * 11.5 + ((hsh >> 2) % 7) - 2); ctx.globalAlpha = Math.min(.9, v * .9); img('foam_s', x, y); if (v > .55) img(hsh % 2 ? 'foam1' : 'foam2', x - 4, y - 4); ctx.globalAlpha = 1; }
    // cage + filet
    const gx = 240 + sh;
    for (let i = gx - 48; i < gx + 48; i += 5) R(i, 66, 1, 36, 'rgba(210,220,235,.45)'); for (let j = 70; j < 102; j += 5) R(gx - 48, j, 96, 1, 'rgba(210,220,235,.45)');
    R(gx - 54, 62, 108, 5, '#2b1d2a'); R(gx - 54, 62, 6, 42, '#2b1d2a'); R(gx + 48, 62, 6, 42, '#2b1d2a');
    R(gx - 53, 63, 106, 3, '#f4f4f4'); R(gx - 53, 63, 4, 40, '#f4f4f4'); R(gx + 49, 63, 4, 40, '#f4f4f4');
    // canons + tuyau
    if (B.hp > 0 || B.fall < .5) for (const c of this.cannons()) {
      ctx.strokeStyle = '#2b8c4a'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(c.x + sh, c.y); ctx.quadraticCurveTo(c.x + 40, c.y + 30, 334, 62); ctx.stroke();
      R(c.x - 6 + sh, c.y - 8, 12, 18, '#2b1d2a'); R(c.x - 5 + sh, c.y - 7, 10, 16, '#7a8494'); R(c.x - 5 + sh, c.y - 7, 3, 16, '#5a6474'); R(c.x + 3 + sh, c.y - 7, 2, 16, '#a8b0bc'); R(c.x - 4 + sh, c.y + 8, 8, 4, '#3a4454');
    }
    if (B.hp > 0) spr(B.hurt > 0 ? 'papa_pose' : 'papa_down0', B.x + sh, 64, { s: 1 });
    else { const q = clamp(B.fall / 1.3, 0, 1); if (q < 1) { ctx.save(); ctx.translate(Math.round(B.x), Math.round(lerp(34, 120, q * q))); ctx.rotate(Math.round(q * 4 / (Math.PI / 2)) * Math.PI / 2); spr('papa_down0', 0, 30, { s: 1 }); ctx.restore(); } else if (B.fall > 2) { ctx.save(); ctx.beginPath(); ctx.rect(B.x - 30, 60, 60, 66); ctx.clip(); face('papa', 'smile', B.x - 24, 130 - Math.round(clamp(B.fall - 2, 0, 1) * 40)); ctx.restore(); img('foam0', B.x - 30, 112, 2); img('foam1', B.x - 4, 114, 2); } }
    if (B.hurt > 0 && B.hp > 0) text('Aïe !', B.x + 18, 8, { size: 10, bold: true, color: PAL.warm });
    // objets au sol
    for (const i of this.items) { R(i.x - 6, i.y + 4, 12, 2, 'rgba(10,20,40,.4)'); img('o_' + i.type, i.x - 8, i.y - 12 - Math.round(Math.abs(Math.sin(i.t * 4)) * 2)); }
    // vagues massives
    for (const w of this.walls) { for (let x = this.L; x < this.Rx; x += 10) if (x + 10 < w.gx || x > w.gx + w.gw) img(((x / 10) % 3 | 0) ? 'foam1' : 'foam2', x - 4, Math.round(w.y - 9 + Math.sin(x + t * 9) * 2)); ctx.globalAlpha = .35 + Math.sin(t * 8) * .15; R(w.gx + 2, Math.round(w.y - 8), w.gw - 4, 16, PAL.glow); ctx.globalAlpha = 1; }
    // joueur
    if (!(P.inv > 0 && Math.floor(t * 14) % 2)) {
      const key = fr(this.cid, P.dir, walkFrame(P.anim, P.moving)), im = IMG[key];
      if (im) { const s = 1, h = im.height * s, clip = 1 - P.sink * .45; spr(key, P.x, P.y + h * (1 - clip), { s, clip }); }
      if (P.sink > .05) for (let i = 0; i < 4; i++) img('foam_s', P.x - 16 + i * 8, P.y - 6);
      if (P.carry) img('o_' + P.carry, P.x - 8, P.y - 62);
    }
    for (const o of this.blobs) img('foam' + (Math.floor(o.x) % 3 + 3) % 3, Math.round(o.x - 18), Math.round(o.y - 18), 2);
    for (const s of this.shots) { ctx.save(); ctx.translate(Math.round(s.x), Math.round(s.y)); ctx.rotate(Math.round(s.rot / (Math.PI / 2)) * Math.PI / 2); ctx.drawImage(IMG['o_' + s.type], -8, -8); ctx.restore(); }
    this.parts.draw();
    // HUD
    panel(W - 196, 4, 164, 15, { fill: 'rgba(12,21,48,.92)' });
    text('Papa', W - 190, 6, { size: 9, bold: true, color: PAL.warm });
    for (let i = 0; i < B.max; i++) R(W - 154 + i * 13, 8, 11, 7, i < B.hp ? PAL.warm : '#2a3560');
    for (let i = 0; i < 3; i++) { const x = 12 + i * 14, y = 22, c = i < P.hp ? PAL.red : '#2a3560'; R(x, y, 4, 4, c); R(x + 5, y, 4, 4, c); R(x - 1, y + 2, 11, 4, c); R(x + 1, y + 6, 7, 2, c); R(x + 3, y + 8, 3, 1, c); }
    if (P.sink > .3) text('Bouge, tu t’enfonces !', 12, 36, { size: 8, color: PAL.warm });
    if (B.hp > 0 && !this.result) { const can = !!P.carry; ctx.globalAlpha = can ? 1 : .45; if (button(W - 84, H - 34, 76, 26, 'Lancer', { primary: can })) { if (can) this.throwIt(); } ctx.globalAlpha = 1; }
    if (this.banner) { ctx.globalAlpha = Math.min(1, this.banner.t * 2); panel(W / 2 - 150, 120, 300, 24, { edge: PAL.glow }); text(this.banner.txt, W / 2, 127, { align: 'center', size: 10, bold: true, color: PAL.glow }); ctx.globalAlpha = 1; }
  }

}
GAMES.final = { id: 'final', title: 'Le city stade', howto: 'Papa arrose tout le terrain depuis la cage. Esquive la mousse et ne reste pas immobile : tu t’enfonces.\nRamasse ballons et chaussures, place-toi sous Papa et touche Lancer (ou Espace). Neuf coups pour le faire tomber.', make: c => new BossGame(c) };

// ---------- ending ----------
const Ending = {
  t: 0, i: 0, dlg: new Dialog(), bubbles: [],
  lines: [['papa', 'Pfff... Bon. Vous m’avez eu, les trois.', 'smile'], ['sacha', 'Alors... on peut rester ?', 'wink'], ['papa', 'Juste ce soir. Et c’est moi qui choisis la musique !', 'smile'], ['narr', 'La soirée mousse peut commencer.']],
  enter() { this.t = 0; this.i = 0; this.dlg.say(...this.lines[0]); SAVE.finalDone = true; persist(); this.bubbles = Array.from({ length: 50 }, () => ({ x: Math.random() * W, y: rand(140, H), r: rand(2, 6), v: rand(8, 26) })); },
  update(dt) {
    this.t += dt; this.dlg.update(dt);
    for (const b of this.bubbles) { b.y -= b.v * dt; if (b.y < 60) { b.y = H; b.x = Math.random() * W; } }
    if (this.i < this.lines.length && this.t > 1.5 && (input.tap || input.keyTap.Space || input.keyTap.Enter)) { input.tap = false; if (!this.dlg.done) this.dlg.skip(); else { this.i++; if (this.i < this.lines.length) this.dlg.say(...this.lines[this.i]); else { this.dlg.msg = ''; SFX.win(); } } }
  },
  draw() {
    const t = this.t;
    img('stade_bg', 0, 0);
    ctx.globalAlpha = .45; R(0, 0, W, H, '#140a30'); ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'lighter';
    ['rgba(255,90,160,.2)', 'rgba(90,200,255,.2)', 'rgba(255,220,90,.18)', 'rgba(160,110,255,.2)'].forEach((c, i) => { const a = Math.sin(t * .9 + i * 1.7) * .6; ctx.fillStyle = c; ctx.beginPath(); ctx.moveTo(60 + i * 120, 0); ctx.lineTo(60 + i * 120 + Math.sin(a) * 260 - 30, H); ctx.lineTo(60 + i * 120 + Math.sin(a) * 260 + 30, H); ctx.fill(); });
    ctx.globalCompositeOperation = 'source-over';
    for (let i = 0; i < 24; i++) { const x = i * 21 + 6, y = 14 + Math.round(Math.sin(i * .9) * 5); R(x, y, 3, 3, '#2b1d2a'); R(x, y, 2, 2, ['#ff8a8a', '#ffd23a', '#8ff3ea', '#c3b3ff'][(i + Math.floor(t * 3)) % 4]); }
    for (let x = -10; x < W; x += 16) img('foam' + ((x / 16 | 0) % 3 + 3) % 3, x, 150 + Math.round(Math.sin(x * .1 + t * 2) * 3), 2);
    const pos = [['cam', 150], ['sacha', 210], ['rox', 270]];
    pos.forEach(([id, x], i) => { const jump = Math.round(Math.abs(Math.sin(t * 4 + i)) * 12); spr(id + '_pose', x, 196 - jump, { s: 1 }); });
    const rise = clamp((t - .3) / 1.2, 0, 1);
    ctx.save(); ctx.beginPath(); ctx.rect(300, 0, 120, 196); ctx.clip(); spr('papa_pose', 352, 250 - Math.round(rise * 52), { s: 1 }); ctx.restore();
    img('foam_s', 340, 142 + Math.round((1 - rise) * 64)); img('foam_s', 350, 139 + Math.round((1 - rise) * 64)); img('foam_s', 358, 143 + Math.round((1 - rise) * 64));
    for (let x = -12; x < W; x += 14) img('foam' + ((x / 14 | 0) % 3 + 3) % 3, x, 180 + Math.round(Math.sin(x * .13 + t * 2.4) * 4), 2);
    R(0, 206, W, H - 206, '#e8f4fc'); for (let x = 0; x < W; x += 12) img('foam_s', x, 210 + (x % 3) * 12);
    for (const b of this.bubbles) { const x = Math.round(b.x + Math.sin(t + b.x) * 4), y = Math.round(b.y), r = Math.round(b.r); R(x - r, y, 1, 1, '#cfefff'); R(x + r, y, 1, 1, '#cfefff'); R(x, y - r, 1, 1, '#cfefff'); R(x, y + r, 1, 1, '#cfefff'); R(x - r + 1, y - r + 1, 1, 1, '#ffffff'); }
    if (this.i < this.lines.length) this.dlg.draw();
    else {
      if (!NEON) buildNeon();
      panel(W / 2 - 134, 30, 268, 136, { edge: PAL.glow });
      ctx.save(); ctx.shadowColor = 'rgba(143,243,234,.9)'; ctx.shadowBlur = 8; ctx.drawImage(NEON, W / 2 - 120, 34, 240, 104 * .9); ctx.restore();
      text('Les cinq épreuves sont gagnées. Bonne soirée mousse !', W / 2, 126, { align: 'center', size: 8, color: PAL.lav });
      if (button(W / 2 - 122, 138, 116, 22, 'Camping', { primary: true, keys: ['Enter', 'Space'] })) { Hub.returnFrom = 'final'; go(Hub); }
      if (button(W / 2 + 6, 138, 116, 22, 'Écran titre', {})) go(TitleScene);
    }
  },
};

// ---------- main loop ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  resetT(); ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  if (scene) {
    scene.draw(); resetT();
    if (!transition.active || transition.dir < 0) scene.update(dt);
  }
  if (transition.active) {
    transition.t += dt * 3.2 * transition.dir;
    if (transition.dir > 0 && transition.t >= 1) { transition.t = 1; transition.dir = -1; setScene(transition.next); input.tap = false; input.down = false; }
    else if (transition.dir < 0 && transition.t <= 0) { transition.t = 0; transition.active = false; }
    resetT(); ctx.fillStyle = `rgba(4,8,22,${clamp(transition.t, 0, 1)})`; ctx.fillRect(0, 0, W, H);
  }
  input.tap = false; input.release = false; input.keyTap = {};
  requestAnimationFrame(frame);
}
(async function boot() {
  resetT(); ctx.fillStyle = '#081128'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#8ff3ea'; ctx.font = '12px monospace'; ctx.textAlign = 'center'; ctx.fillText('Chargement…', W / 2, H / 2);
  try { await Promise.race([document.fonts.load(`500 10px ${FONT}`).then(() => document.fonts.load(`700 10px ${FONT}`)).then(() => document.fonts.load('44px "Yellowtail"')), new Promise(r => setTimeout(r, 2500))]); } catch (_) {}
  await loadImages();
  setScene(TitleScene);
  requestAnimationFrame(t => { last = t; frame(t); });
})();
